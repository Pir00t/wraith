[project]
name = "wraith"
version = "0.1.0"
description = "Workbench for Rapid Analysis, Intelligence & Triage Hunts"
authors = [
    { name = "Pir00t", email = "cybersecureguy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0,<4",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
]

[project.scripts]
wraith = "wraith:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
